<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Mission Control · Chief of Staff</title>
<style>
  :root {
    --bg-deep: #02060d;
    --bg: #0a0e1a;
    --bg-soft: rgba(12,18,32,0.92);
    --border: rgba(74,216,255,0.22);
    --border-soft: rgba(255,255,255,0.06);
    --text: #e6eaf3;
    --text-dim: #8590a6;
    --text-faint: #5a6477;
    --cyan: #4ad8ff;
    --purple: #a855f7;
    --green: #10b981;
    --yellow: #fbbf24;
    --red: #ef4444;
    --blue: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Assistant', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(ellipse at top, #0a1325 0%, #02060d 60%);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    padding: 24px 20px 32px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  header h1 .acc { color: var(--cyan); margin-left: 6px; }
  header .sub {
    font-size: 12px;
    color: var(--text-faint);
    margin-top: 4px;
  }
  header nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid var(--border-soft);
    border-radius: 6px;
    transition: all 0.15s;
  }
  header nav a:hover {
    border-color: var(--border);
    color: var(--cyan);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    height: calc(100vh - 110px);
  }
  .col {
    background: var(--bg-soft);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(6px);
  }
  .col-head {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .col-head .lbl {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .col-head .count {
    background: rgba(255,255,255,0.07);
    color: var(--text-dim);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace;
  }
  .col[data-col="insights"]  .col-head .lbl { color: var(--cyan); }
  .col[data-col="planned"]   .col-head .lbl { color: var(--purple); }
  .col[data-col="working"]   .col-head .lbl { color: var(--yellow); }
  .col[data-col="done"]      .col-head .lbl { color: var(--green); }
  .col-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .col-body::-webkit-scrollbar { width: 6px; }
  .col-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
  .empty {
    color: var(--text-faint);
    font-size: 12px;
    font-style: italic;
    padding: 16px 8px;
    text-align: center;
  }
  .card {
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border-soft);
    border-right: 2px solid var(--text-faint);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 12px;
    line-height: 1.45;
    transition: all 0.15s;
    cursor: pointer;
  }
  .card:hover {
    background: rgba(255,255,255,0.04);
    border-right-color: var(--cyan);
    transform: translateX(-2px);
  }
  .card .meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 10px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }
  .card .agent {
    color: var(--cyan);
    font-weight: 600;
  }
  .card .title {
    color: var(--text);
    margin: 2px 0;
    word-wrap: break-word;
  }
  .card .body {
    color: var(--text-dim);
    font-size: 11px;
    margin-top: 4px;
    line-height: 1.4;
  }
  .card .subject {
    display: inline-block;
    background: rgba(74,216,255,0.08);
    color: var(--cyan);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .card.kind-insight    { border-right-color: var(--cyan); }
  .card.kind-pattern    { border-right-color: var(--cyan); }
  .card.kind-idea       { border-right-color: var(--cyan); }
  .card.kind-task       { border-right-color: var(--purple); }
  .card.kind-project    { border-right-color: var(--purple); }
  .card.kind-handoff    { border-right-color: var(--yellow); }
  .card.kind-ask        { border-right-color: var(--yellow); }
  .card.kind-escalate   { border-right-color: var(--red); }
  .card.kind-report     { border-right-color: var(--green); }
  .card.severity-warning  { background: rgba(251,191,36,0.05); }
  .card.severity-critical { background: rgba(239,68,68,0.06); }
  .actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed var(--border-soft);
  }
  .actions button {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-soft);
    color: var(--text-dim);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .actions button:hover {
    background: rgba(74,216,255,0.1);
    color: var(--cyan);
    border-color: var(--cyan);
  }
  .actions button.danger:hover {
    background: rgba(239,68,68,0.1);
    color: var(--red);
    border-color: var(--red);
  }
  /* Footer status */
  footer {
    position: fixed;
    bottom: 12px;
    left: 20px;
    font-size: 10px;
    color: var(--text-faint);
    font-family: 'JetBrains Mono', monospace;
  }
  footer .pulse {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-left: 6px;
    box-shadow: 0 0 6px var(--green);
    animation: blink 2s infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>

<header>
  <div>
    <h1>🎯 Mission<span class="acc">Control</span></h1>
    <div class="sub">מה כל סוכן מטפל בו ברגע זה</div>
  </div>
  <nav>
    <a href="/office">↩ Office</a>
    <a href="/">↩ Chief of Staff</a>
  </nav>
</header>

<div class="board">
  <div class="col" data-col="insights">
    <div class="col-head">
      <span class="lbl">💡 תובנות</span>
      <span class="count" id="c-insights">0</span>
    </div>
    <div class="col-body" id="b-insights"></div>
  </div>
  <div class="col" data-col="planned">
    <div class="col-head">
      <span class="lbl">📋 מתוכננות</span>
      <span class="count" id="c-planned">0</span>
    </div>
    <div class="col-body" id="b-planned"></div>
  </div>
  <div class="col" data-col="working">
    <div class="col-head">
      <span class="lbl">⚡ בעבודה</span>
      <span class="count" id="c-working">0</span>
    </div>
    <div class="col-body" id="b-working"></div>
  </div>
  <div class="col" data-col="done">
    <div class="col-head">
      <span class="lbl">✓ הושלמו השבוע</span>
      <span class="count" id="c-done">0</span>
    </div>
    <div class="col-body" id="b-done"></div>
  </div>
</div>

<footer>
  <span id="status">טוען...</span>
  <span class="pulse"></span>
  <span style="margin-right:14px;color:var(--text-faint);">⌘K לחיפוש מהיר</span>
</footer>

<script src="/static/command-palette.js" defer></script>

<script>
const $ = sel => document.querySelector(sel);
const API = '';

function timeAgo(iso) {
  if (!iso) return '';
  const t = Date.parse(iso.endsWith('Z') ? iso : iso + 'Z');
  if (!t) return iso;
  const diff = Math.floor((Date.now() - t) / 1000);
  if (diff < 60) return `${diff}s`;
  if (diff < 3600) return `${Math.floor(diff/60)}m`;
  if (diff < 86400) return `${Math.floor(diff/3600)}h`;
  return `${Math.floor(diff/86400)}d`;
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCard(item) {
  const cls = [
    'card',
    item.kind ? `kind-${item.kind}` : '',
    item.severity ? `severity-${item.severity}` : '',
  ].filter(Boolean).join(' ');
  const subj = (item.subject_kind && item.subject_slug)
    ? `<span class="subject">${item.subject_kind}:${item.subject_slug}</span>`
    : '';
  const agent = item.agent_label
    ? `<span class="agent">${escapeHtml(item.agent_label)}</span>`
    : '';
  const meta = `<div class="meta">${agent}<span>${timeAgo(item.ts)}</span></div>`;
  const title = `<div class="title">${escapeHtml(item.title || '—')}</div>`;
  const body = item.body ? `<div class="body">${escapeHtml(item.body).slice(0,180)}</div>` : '';
  const actions = item.actions_html ? `<div class="actions">${item.actions_html}</div>` : '';
  return `<div class="${cls}" data-id="${item.id || ''}">${meta}${title}${body}${subj}${actions}</div>`;
}

function renderColumn(colSlug, items) {
  const body = $(`#b-${colSlug}`);
  const count = $(`#c-${colSlug}`);
  if (!body) return;
  if (!items.length) {
    body.innerHTML = '<div class="empty">שקט כאן.</div>';
    count.textContent = '0';
    return;
  }
  body.innerHTML = items.map(renderCard).join('');
  count.textContent = items.length;
}

async function ackObs(id) {
  await fetch(`/api/observations/${id}/ack`, {method:'POST'});
  load();
}
async function resolveObs(id) {
  await fetch(`/api/observations/${id}/resolve`, {method:'POST'});
  load();
}

window.ackObs = ackObs;
window.resolveObs = resolveObs;

async function load() {
  try {
    const state = await fetch('/api/state').then(r => r.json());
    const messages = await fetch('/api/agents/messages?limit=80').then(r => r.json());

    const obs = state.observations || [];
    // Bucket observations
    const insightKinds = new Set(['insight', 'pattern', 'idea']);
    const insights = obs
      .filter(o => insightKinds.has(o.kind))
      .map(o => ({
        ...o,
        actions_html: `<button onclick="resolveObs(${o.id})">סמן כסיים</button>`,
      }));

    const tasksFromObs = obs
      .filter(o => o.kind === 'task' || o.kind === 'alert')
      .map(o => ({
        ...o,
        actions_html: o.kind === 'alert'
          ? `<button onclick="resolveObs(${o.id})">פתור</button>`
          : `<button onclick="resolveObs(${o.id})">סמן כסיים</button>`,
      }));

    // Open projects → also "planned"
    const projects = (state.projects || []).map(p => ({
      id: p.id,
      kind: 'project',
      title: p.title,
      body: p.description,
      severity: p.severity,
      ts: p.ts,
      agent_label: p.icon ? `${p.icon} ${p.slug}` : p.slug,
    }));
    const planned = [...projects, ...tasksFromObs];

    // Working = open handoffs/asks/escalates from agent_messages
    const working = messages
      .filter(m => !m.completed && ['handoff', 'ask', 'escalate'].includes(m.kind))
      .map(m => ({
        ...m,
        agent_label: `${m.from_agent} → ${m.to_agent || '?'}`,
      }));

    // Done — reports from past week + recently resolved observations
    const oneWeekAgo = Date.now() - 7 * 24 * 3600 * 1000;
    const done = messages
      .filter(m => m.kind === 'report' || m.completed)
      .filter(m => {
        const t = Date.parse((m.ts || '').endsWith('Z') ? m.ts : m.ts + 'Z');
        return t && t >= oneWeekAgo;
      })
      .map(m => ({
        ...m,
        agent_label: `${m.from_agent} → ${m.to_agent || '?'}`,
      }))
      .slice(0, 40);

    renderColumn('insights', insights);
    renderColumn('planned', planned);
    renderColumn('working', working);
    renderColumn('done', done);

    $('#status').textContent = `עודכן ${new Date().toLocaleTimeString('he-IL')} · ${insights.length + planned.length + working.length} פתוח`;
  } catch (e) {
    $('#status').textContent = `שגיאה: ${e.message || e}`;
  }
}

load();
setInterval(load, 8000);
</script>
</body>
</html>
